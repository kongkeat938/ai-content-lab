name: delete-video

# Remove a bad or duplicate upload from a channel. The rail can publish but not
# unpublish; when a build ships wrong (a double-loop made a 30-minute talk run
# 57 minutes) the only way to replace it is to delete it, and publish_batch will
# not re-upload while a video with the same title is still live.
#
# A delete is irreversible, so the script behind this is guarded: it needs an
# explicit id, defaults to a dry run, backs up the metadata first, and refuses to
# delete a video that already has views unless force is set. It runs here because
# the pod IP is throttled by the Data API.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "channel slug (dharma, genx, kongkeat-story)"
        default: "dharma"
      video:
        description: "the video id to delete"
        required: true
      confirm:
        description: "type DELETE to actually delete; anything else is a dry run"
        default: ""
      force:
        description: "true to allow deleting a video with views"
        default: "false"

permissions:
  contents: write   # commit the metadata backup

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Delete the video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          ARGS="--slug ${{ inputs.slug }} --video ${{ inputs.video }}"
          if [ "${{ inputs.confirm }}" = "DELETE" ]; then ARGS="$ARGS --yes"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 scripts/delete_video.py $ARGS

      - name: Commit the metadata backup
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain content/deleted 2>/dev/null)" ]; then
            echo "no backup to commit"
            exit 0
          fi
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add content/deleted
          git commit -m "delete: back up metadata before removing a video [skip ci]"
          git pull --rebase --autostash origin main
          bash scripts/git_push_retry.sh
