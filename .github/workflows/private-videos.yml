name: private-videos

# List and remove the non-public videos on our channels.
#
# Two things end up non-public and they must not be treated alike: a SCHEDULED
# release (private with a future publishAt -- YouTube flips it public at the slot,
# deleting it throws a queued video away) and a PARKED clip (private with no future
# publishAt -- a rogue upload we hid, or a paused bad cut). This removes the parked
# set only. It runs here because the pod IP is throttled by the Data API.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "channel slugs, space separated (dharma genx kongkeat-story)"
        default: "dharma genx kongkeat-story"
      remove:
        description: "true to delete the PARKED videos (default: list only)"
        default: "false"
      include_unlisted:
        description: "true to also delete unlisted clips (default: private only)"
        default: "false"
      confirm:
        description: "type DELETE to actually delete; anything else is a dry run"
        default: ""

permissions:
  contents: write   # commit the metadata backups + the report

jobs:
  private-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List (and optionally remove) the non-public videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          ARGS=""
          for s in ${{ inputs.slugs }}; do ARGS="$ARGS --slug $s"; done
          if [ "${{ inputs.include_unlisted }}" = "true" ]; then ARGS="$ARGS --include-unlisted"; fi
          if [ "${{ inputs.remove }}" = "true" ] && [ "${{ inputs.confirm }}" = "DELETE" ]; then
            ARGS="$ARGS --delete --yes"
          fi
          python3 scripts/private_videos.py $ARGS

      - name: Commit the backups and the report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          changed=0
          for d in content/deleted work; do
            if [ -n "$(git status --porcelain "$d" 2>/dev/null)" ]; then
              git add "$d"; changed=1
            fi
          done
          if [ "$changed" = "0" ]; then echo "nothing to commit"; exit 0; fi
          git commit -m "private-videos: back up metadata before removing non-public videos [skip ci]"
          git pull --rebase --autostash origin main
          bash scripts/git_push_retry.sh
