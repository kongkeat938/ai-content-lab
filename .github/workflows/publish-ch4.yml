name: publish-ch4

# Uploads finished, verified ch4 (เรื่องเล่าอบอุ่นใจ) long-form with the YouTube Data
# API -- no browser, no human. Same rail as publish-batch, a different manifest.
#
# Privacy comes from each entry in content/ch4_publish.json (ak sets it; the
# HOLD that made the first long-form private was lifted 2026-11-06). Dispatch
# with the privacy input to override for a single run.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated keys (blank = every ready entry)"
        default: ""
      privacy:
        description: "private | unlisted | public (blank = each entry's own)"
        default: ""
      dry_run:
        description: "true to only list what would be posted"
        default: "false"
  push:
    paths:
      - "content/ch4_publish.json"
  schedule:
    # PAUSED 2026-11-12: kongkeat is a dead channel (measured +3 views/day, 0 subs,
    # 0.5 long-form watch-hours in 28 days). Nothing is due to publish, and the
    # rail stays runnable by hand. Re-enable by removing "kongkeat" from
    # content/PAUSED and restoring these crons.
    # - cron: "3 8 * * *"
    # - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: publish-ch4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet -r requirements.txt

      - name: Publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          ARGS="--manifest content/ch4_publish.json"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.privacy }}" ]; then ARGS="$ARGS --privacy ${{ github.event.inputs.privacy }}"; fi
          for k in ${{ github.event.inputs.only }}; do ARGS="$ARGS --only $k"; done
          python3 scripts/publish_batch.py $ARGS

      - name: Record the new video ids
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet content/ch4_publish.json content/upload_limit.json; then
            echo "no change to the manifest"
            exit 0
          fi
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add content/ch4_publish.json content/upload_limit.json
          git commit -m "publish(ch4): record live video ids / upload-cap reset"
          git pull --rebase --autostash origin main
          bash scripts/git_push_retry.sh
