name: publish-ch4

# Uploads finished, verified ch4 (เรื่องเล่าการ์ตูน) long-form with the YouTube Data
# API -- no browser, no human. Same rail as publish-batch, a different manifest.
#
# The first ch4 long-form lands private: K reviews a channel's first work before
# it goes public. Flip `privacy` to public in content/ch4_publish.json once
# approved, or dispatch with the privacy input.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated keys (blank = every ready entry)"
        default: ""
      privacy:
        description: "private | unlisted | public (blank = each entry's own)"
        default: ""
      dry_run:
        description: "true to only list what would be posted"
        default: "false"
  push:
    paths:
      - "content/ch4_publish.json"
  schedule:
    # ch4 hits its per-day upload cap most days; the cap clears ~3h after it is
    # hit (measured: content/upload_limit.json). A frequent tick is cheap -- an
    # entry with a video_id is never re-uploaded -- so run often enough to catch
    # the reset without anyone dispatching by hand.
    - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: publish-ch4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet -r requirements.txt

      - name: Publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          ARGS="--manifest content/ch4_publish.json"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.privacy }}" ]; then ARGS="$ARGS --privacy ${{ github.event.inputs.privacy }}"; fi
          for k in ${{ github.event.inputs.only }}; do ARGS="$ARGS --only $k"; done
          python3 scripts/publish_batch.py $ARGS

      - name: Record the new video ids
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet content/ch4_publish.json content/upload_limit.json; then
            echo "no change to the manifest"
            exit 0
          fi
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add content/ch4_publish.json content/upload_limit.json
          git commit -m "publish(ch4): record live video ids / upload-cap reset"
          git pull --rebase --autostash origin main
          git push
