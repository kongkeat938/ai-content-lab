name: ch4-longform

# Builds a ch4 (เรื่องเล่าการ์ตูน) family-moment long-form and puts the media on a
# Release, so the Shorts funnel has an on-niche destination.
#
# Why: ch4's only long-form is the classical-tale set (มัทนะพาธา, ไกรทอง), which
# measured 1-6 views, while the family-moment Shorts measured 460-1,083 and loop
# past 100%. The funnel now points every ch4 Short at a long-form, so that
# destination must be the shape the audience actually watches. This reuses the
# verified dharma night rail (build_night.py), which is why the rail was given
# --title/--subtitle/--voice.
#
# It queues the result in content/ch4_publish.json and dispatches publish-ch4,
# so a build becomes a live video without a hand-written manifest entry.
#
# A scheduled run mints its own content set with gen_family_scripts.py (themed by
# ISO week, reused within the week), so the family rail keeps producing without a
# hand-written script -- the same shape the dharma rail uses.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Target length in minutes"
        default: "30"
      content:
        description: "Content directory (blank = pick/generate)"
        default: ""
      key:
        description: "Manifest key (blank = content dir name + _long)"
        default: ""
      title:
        description: "Video title (blank = a generic family-story title)"
        default: ""
      generate:
        description: "true to generate a fresh content set with Gemini"
        default: "false"
  schedule:
    - cron: "37 3 * * 4"   # Thursdays 03:37 UTC -- the dharma rail owns Monday

permissions:
  contents: write
  issues: write
  actions: write   # dispatch publish-ch4 after the manifest is updated

concurrency:
  group: ch4-longform
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Thai fonts + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-tlwg-garuda fonts-tlwg-kinnari fonts-tlwg-norasi
          pip install --quiet -r requirements.txt

      - name: Resolve the content directory (and generate one on schedule)
        id: pick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          CONTENT="${{ inputs.content }}"
          GEN="${{ inputs.generate }}"
          THEME="${{ inputs.title }}"
          if [ -z "$CONTENT" ]; then
            if [ "$GEN" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
              # One fresh set a week keeps the rail fed. The directory is dated per
              # ISO week and reused if it already has pieces, so a re-run of the
              # same week reuses the committed set instead of asking Gemini for a
              # different one -- which would fingerprint differently and publish a
              # near-duplicate.
              CONTENT="content/ch4_auto_$(date -u +%G%V)"
              if ls "$CONTENT"/*.txt >/dev/null 2>&1; then
                echo "$CONTENT already has pieces; reusing it"
              else
                THEMES=("ความรักของแม่ที่เราไม่ทันเห็น" "วันที่พ่อสอนให้ล้มแล้วลุก"
                        "ยายกับความอบอุ่นในคืนฝนตก" "พี่น้องที่คอยปกป้องกันเงียบ ๆ"
                        "บ้านที่ยังมีคนรอเรากลับ" "ของเล่นเก่าและมือที่ซ่อมมัน"
                        "มื้อเช้าที่ไม่มีวันขาด" "วันที่เราโตพอจะดูแลท่านตอบ")
                wk=$(( 10#$(date -u +%V) % ${#THEMES[@]} ))
                THEME="${THEMES[$wk]}"
                python3 scripts/gen_family_scripts.py \
                  --theme "$THEME" --out "$CONTENT" --count 10
              fi
            else
              CONTENT="content/ch4_family_01"
            fi
          fi
          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"
          echo "theme=$THEME" >> "$GITHUB_OUTPUT"
          echo "building from $CONTENT"

      - name: Commit a freshly generated content set
        if: github.event_name == 'schedule' || inputs.generate == 'true'
        run: |
          git add "${{ steps.pick.outputs.content }}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new content to commit"
            exit 0
          fi
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git commit -m "ch4: add generated content set ${{ steps.pick.outputs.content }} [skip ci]"
          git pull --rebase --autostash origin main
          git push

      - name: Build and verify
        run: |
          # The panel's #1 lever is a spoken promise in the first 20 seconds; the
          # picture then changes per chapter instead of one card looping all file.
          HOOK="คืนนี้ ... ถ้าคุณอยากมีเรื่องอบอุ่นไว้ฟังก่อนนอน สามสิบนาทีนี้เรามีเรื่องเล่าให้ใจได้พัก"
          python3 scripts/build_night.py \
            --content "${{ steps.pick.outputs.content }}" \
            --work work/ch4_family_01 \
            --out work/ch4_family_01 \
            --minutes "${{ inputs.minutes || '30' }}" \
            --title "เรื่องเล่าอบอุ่นใจ" \
            --subtitle "รวมเรื่องครอบครัว ฟังเพลินทั้งคืน" \
            --voice th-TH-NiwatNeural \
            --image-style family \
            --hook "$HOOK" \
            --chapters \
            --image-prompt "warm Thai family home evening, soft golden lamp light, cozy"

      - name: Show the receipt
        if: always()
        run: test -f work/ch4_family_01/receipt.json && cat work/ch4_family_01/receipt.json || echo "no receipt"

      - name: Fingerprint the build
        id: fp
        run: |
          # A fixed tag meant a rebuild of different content clobbered the same
          # release, so the manifest could point at bytes that no longer match the
          # title. Fold the content, the rail and the voice into the tag instead.
          CONTENT="${{ steps.pick.outputs.content }}"
          fp="$(cat "$CONTENT"/*.txt \
                 scripts/make_compilation.py scripts/make_bed.py scripts/make_audio.py \
                 scripts/make_night_video.py scripts/make_poster.py scripts/verify_night.py \
                 | sha256sum | cut -c1-12)"
          fp="${fp}-$(echo "NiwatNeural" | sha256sum | cut -c1-6)"
          echo "fp=$fp" >> "$GITHUB_OUTPUT"

      - name: Publish the media to a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="ch4-family-long-${{ steps.fp.outputs.fp }}"
          gh release create "$tag" \
            work/ch4_family_01/video.mp4 work/ch4_family_01/compilation.mp3 \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "ch4 family-moment long-form. Regenerable from content/ch4_family_01 + scripts/." \
            || gh release upload "$tag" work/ch4_family_01/video.mp4 work/ch4_family_01/compilation.mp3 \
               --repo "${{ github.repository }}" --clobber

      - name: Add the release to the ch4 publish manifest and start the upload
        # Same hand-off the ch2 rail was missing: without it the file sits on a
        # Release and a person has to write the manifest entry by hand.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT="${{ steps.pick.outputs.content }}"
          KEY="${{ inputs.key }}"; KEY="${KEY:-$(basename "$CONTENT")_long}"
          TITLE="${{ inputs.title }}"
          THEME="${{ steps.pick.outputs.theme }}"
          if [ -z "$TITLE" ]; then
            if [ -n "$THEME" ]; then
              TITLE="เรื่องเล่าอบอุ่นใจ — $THEME รวมเรื่องครอบครัวฟังเพลินทั้งคืน"
            else
              TITLE="เรื่องเล่าอบอุ่นใจ รวมเรื่องครอบครัว ฟังเพลินทั้งคืน"
            fi
          fi
          MIN="${{ inputs.minutes || '30' }}"
          python3 scripts/add_release_to_manifest.py \
            --manifest content/ch4_publish.json --channel kongkeat \
            --tag "ch4-family-long-${{ steps.fp.outputs.fp }}" \
            --key "$KEY" --content "$CONTENT" --minutes "$MIN" \
            --title "$TITLE" --receipt work/ch4_family_01/receipt.json
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add content/ch4_publish.json
          git add assets/branding/thumbs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git commit -m "ch4: queue $KEY for publish [skip ci]"
          git pull --rebase --autostash origin main
          git push
          # A push made with GITHUB_TOKEN does not start another workflow.
          gh workflow run publish-ch4.yml --repo "${{ github.repository }}"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "ch4-longform run failed" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
