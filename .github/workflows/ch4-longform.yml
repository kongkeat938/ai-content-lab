name: ch4-longform

# Builds a ch4 (PCSEV) general-knowledge long-form and puts the media
# on a Release.
#
# PIVOT 2026-11-16: ch4 was เรื่องเล่าอบอุ่นใจ (warm family stories), and it was
# the weakest channel on the fleet -- measured 2026-11-11: 0.7 long-form
# watch-hours in 28 days (0.2% of the YPP bar) and 5.2% AVD, because the picture
# was one still poster card looping under the voice. The owner asked for a new
# format with new tools. A five-advisor panel (scripts/advise.py, three runs) and
# a live YouTube Data API pull (region TH) chose the genre: general knowledge
# (top-10 long-form median 3.2M views; recent-60d median 7.5k across 5 channels,
# i.e. demand plus room). Food was rejected on feasibility -- its visuals need
# real cooking footage a CPU-only runner cannot make.
#
# The tool changed with the genre: make_kinetic_video.py renders an
# always-moving background (animated gradients + grain + hue drift) with
# libass captions timed to the narration's own line starts, replacing the static
# card. gen_knowledge_scripts.py mints the content set. Both are CPU-only.
#
# It queues the result in content/ch4_publish.json and dispatches publish-ch4,
# so a build becomes a live video without a hand-written manifest entry.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Target length in minutes"
        default: "30"
      content:
        description: "Content directory (blank = pick/generate)"
        default: ""
      key:
        description: "Manifest key (blank = content dir name + _long)"
        default: ""
      title:
        description: "Video title (blank = a generic knowledge title)"
        default: ""
      generate:
        description: "true to generate a fresh content set with Gemini"
        default: "false"
  # UNPAUSED 2026-11-13 on K's order ("ลุย ch4"). To pause it: add "kongkeat" back
  # to content/PAUSED and comment out the WHOLE `schedule:` key (a comment-only
  # block parses as `schedule: null`, which makes GitHub reject the entire
  # workflow). Guard: test_workflow_yaml.py.
  schedule:
    - cron: "37 3 * * 4"   # Thursdays 03:37 UTC -- the dharma rail owns Monday

permissions:
  contents: write
  issues: write
  actions: write   # dispatch publish-ch4 after the manifest is updated

concurrency:
  group: ch4-longform
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Thai fonts + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-tlwg-garuda fonts-tlwg-kinnari fonts-tlwg-norasi
          pip install --quiet -r requirements.txt

      - name: Resolve the content directory (and generate one on schedule)
        id: pick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          CONTENT="${{ inputs.content }}"
          GEN="${{ inputs.generate }}"
          THEME="${{ inputs.title }}"
          if [ -z "$CONTENT" ]; then
            if [ "$GEN" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
              # One fresh set PER RUN, not per ISO week. Measured 2026-11-13: two
              # runs in the same week both generated content/ch4_auto_202646 and both
              # committed it -> an add/add conflict on every piece, both pushes were
              # rejected, and a finished video was stranded (issues #28/#29). The run
              # number is stable across a re-run (a retry reuses its set, so no
              # near-duplicate) and distinct across runs.
              CONTENT="content/ch4_know_$(date -u +%G%V)_r${GITHUB_RUN_NUMBER:-0}"
              if ls "$CONTENT"/*.txt >/dev/null 2>&1; then
                echo "$CONTENT already has pieces; reusing it"
              else
                THEMES=("ทำไมร่างกายและธรรมชาติรอบตัวเราถึงเป็นแบบนี้"
                        "เกร็ดความรู้วิทยาศาสตร์ที่เจอในชีวิตประจำวัน"
                        "คำถามคาใจเรื่องท้องฟ้า ดวงดาว และอากาศ"
                        "เรื่องน่ารู้ของสัตว์ที่เราคิดว่าเรารู้จัก"
                        "ทำไมสิ่งรอบตัวจึงทำงานแบบนั้น"
                        "เกร็ดความรู้ที่ฟังแล้วต้องร้องอ๋อ"
                        "วิทยาศาสตร์ในครัวและในบ้านของเรา"
                        "คำถามเด็ก ๆ ที่ผู้ใหญ่ก็ยังตอบไม่ได้")
                wk=$(( 10#$(date -u +%V) % ${#THEMES[@]} ))
                THEME="${THEMES[$wk]}"
                python3 scripts/gen_knowledge_scripts.py \
                  --theme "$THEME" --out "$CONTENT" --count 12
              fi
            else
              CONTENT="content/ch4_know_01"
            fi
          fi
          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"
          echo "theme=$THEME" >> "$GITHUB_OUTPUT"
          echo "building from $CONTENT"

      - name: Commit a freshly generated content set
        if: github.event_name == 'schedule' || inputs.generate == 'true'
        run: |
          git add "${{ steps.pick.outputs.content }}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new content to commit"
            exit 0
          fi
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git commit -m "ch4: add generated content set ${{ steps.pick.outputs.content }} [skip ci]"
          bash scripts/git_push_retry.sh

      - name: Build and verify
        run: |
          # The panel's #1 lever is a spoken promise in the first 20 seconds, and
          # the picture must move the whole file AND change as the narration moves
          # between beats. The knowledge rail uses the kinetic engine with --broll:
          # one REAL stock clip per beat (free keyless Coverr) as the base, captions
          # synced to the narration, and the cold open from content/hooks/knowledge.md.
          #
          # STYLE 2026-11-17 (measured): the owner's reference clip (Veo) is a real
          # photograph of a person. A free model cannot make a believable human
          # (pollinations 3-4/10, Gemini free image quota 0), and a five-advisor panel
          # said do not ship AI faces. Raw stock under a caption scored 4-5/10
          # "generic stock slop"; a consistent warm grade + a designed frosted-glass
          # card over the same footage lifted it to 7/10 with a blunt "looks
          # intentional" verdict. So the base is real footage, graded as one story.
          # See docs/QA-VIDEO-STANDARD.md and scripts/make_qa_video.py.
          python3 scripts/build_night.py \
            --content "${{ steps.pick.outputs.content }}" \
            --work work/ch4_know_01 \
            --out work/ch4_know_01 \
            --minutes "${{ inputs.minutes || '30' }}" \
            --title "PCSEV" \
            --subtitle "เกร็ดน่ารู้ ฟังเพลินได้ทั้งวัน" \
            --voice th-TH-NiwatNeural \
            --engine kinetic \
            --broll \
            --brand "PCSEV" \
            --hook-file content/hooks/knowledge.md \
            --bed-ledger content/bed_ledger_kongkeat.json

      - name: Show the receipt
        if: always()
        run: test -f work/ch4_know_01/receipt.json && cat work/ch4_know_01/receipt.json || echo "no receipt"

      - name: Fingerprint the build
        id: fp
        run: |
          # A fixed tag meant a rebuild of different content clobbered the same
          # release, so the manifest could point at bytes that no longer match the
          # title. Fold the content, the rail and the voice into the tag instead.
          CONTENT="${{ steps.pick.outputs.content }}"
          fp="$(cat "$CONTENT"/*.txt \
                 content/hooks/knowledge.md \
                 scripts/make_compilation.py scripts/make_audio.py \
                 scripts/make_kinetic_video.py scripts/make_chapter_video.py \
                 scripts/build_night.py scripts/gen_cover_image.py \
                 scripts/verify_night.py \
                 | sha256sum | cut -c1-12)"
          fp="${fp}-$(echo "NiwatNeural" | sha256sum | cut -c1-6)"
          echo "fp=$fp" >> "$GITHUB_OUTPUT"

      - name: Publish the media to a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="ch4-know-long-${{ steps.fp.outputs.fp }}"
          gh release create "$tag" \
            work/ch4_know_01/video.mp4 work/ch4_know_01/compilation.mp3 work/ch4_know_01/receipt.json \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "ch4 knowledge long-form. Regenerable from content/ch4_know_01 + scripts/." \
            || gh release upload "$tag" work/ch4_know_01/video.mp4 work/ch4_know_01/compilation.mp3 work/ch4_know_01/receipt.json \
               --repo "${{ github.repository }}" --clobber

      - name: Add the release to the ch4 publish manifest and start the upload
        # Same hand-off the ch2 rail was missing: without it the file sits on a
        # Release and a person has to write the manifest entry by hand.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CONTENT="${{ steps.pick.outputs.content }}"
          KEY="${{ inputs.key }}"; KEY="${KEY:-$(basename "$CONTENT")_long}"
          TITLE="${{ inputs.title }}"
          THEME="${{ steps.pick.outputs.theme }}"
          if [ -z "$TITLE" ]; then
            if [ -n "$THEME" ]; then
              TITLE="PCSEV — $THEME"
            else
              TITLE="PCSEV รวมเกร็ดน่ารู้ฟังเพลิน"
            fi
          fi
          MIN="${{ inputs.minutes || '30' }}"
          python3 scripts/add_release_to_manifest.py \
            --manifest content/ch4_publish.json --channel kongkeat \
            --tag "ch4-know-long-${{ steps.fp.outputs.fp }}" \
            --key "$KEY" --content "$CONTENT" --minutes "$MIN" \
            --title "$TITLE" --receipt work/ch4_know_01/receipt.json
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add content/ch4_publish.json content/bed_ledger_kongkeat.json
          git add assets/branding/thumbs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git commit -m "ch4: queue $KEY for publish [skip ci]"
          # A single pull-then-push loses the race when another rail commits in
          # between (measured 2026-11-09 on the night rail), which strands a
          # finished video. The helper rebases and retries.
          bash scripts/git_push_retry.sh
          # A push made with GITHUB_TOKEN does not start another workflow.
          gh workflow run publish-ch4.yml --repo "${{ github.repository }}"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "ch4-longform run failed" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
