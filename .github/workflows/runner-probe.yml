name: runner-probe

# One question: is a self-hosted runner registered to this repository? If yes, a job
# with runs-on: self-hosted lands on PC1, which is the only machine that can restart
# the winremote MCP server and read the mail. If no runner is registered the job
# stays queued and this probe answers "no" by timing out. Deleted once answered.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Report the machine
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          hostname
          echo "PROBE_OK"
