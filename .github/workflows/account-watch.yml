name: account-watch

# K's ask (2026-11-03): a mail nobody reads can quietly hurt the business -- a
# copyright claim, a monetisation decision, a payment problem. This runs
# scripts/mail_watch.py and reports what it finds.
#
# Layer 1 (channel health) always runs: the Data API shows a rejected, failed or
# region-restricted video, which is the same class of event YouTube mails about.
# Layer 2 (the inbox) runs only when a mail credential is present:
#   IMAP_USER + IMAP_APP_PASSWORD  (a Google app password, not the login password)
# Without them the job says the inbox is BLIND instead of pretending all is well.
#
# Started by the foreman (daily, after the 08:00 UTC reset), by the watchdog, or by
# hand. It also carries its own cron as a backstop -- measured 2026-11-07, the
# scheduler does fire here, so the cron is a real second path, not a decoration.
on:
  schedule:
    - cron: "42 8 * * *"   # daily, 08:42 UTC -- after the quota reset
  workflow_dispatch:
    inputs:
      days:
        description: "how far back to read unread mail"
        default: "3"
      commit:
        description: "true to commit docs/MAIL-ALERTS.md"
        default: "true"

permissions:
  contents: write
  issues: write

concurrency:
  group: account-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the YouTube client
        run: pip install --quiet google-api-python-client google-auth-oauthlib

      - name: Watch the accounts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
          IMAP_ACCOUNTS: ${{ secrets.IMAP_ACCOUNTS }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
          PC1_MCP_URL: ${{ secrets.PC1_MCP_URL }}
          PC1_MCP_TOKEN: ${{ secrets.PC1_MCP_TOKEN }}
        run: |
          set +e
          python3 scripts/mail_watch.py --days "${{ github.event.inputs.days || '3' }}" --write
          echo "exit=$?" >> "$GITHUB_STEP_SUMMARY"
          # The inbox is read from the cloud now (IMAP_ACCOUNTS is a repository
          # secret), so mail no longer depends on PC1. PC1 is probed only when its
          # funnel URL is configured; with no PC1_MCP_URL the step says so and moves
          # on. NOTE (measured 2026-11-09): IMAP_ACCOUNTS currently holds only
          # kongkeat.938, so dharma/ch4 inboxes are NOT read yet -- add their app
          # passwords to the secret to cover them.
          python3 scripts/pc1_health.py --write >> "$GITHUB_STEP_SUMMARY" 2>&1
          cat docs/MAIL-ALERTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Audit the channels for rogue uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          set +e
          # A video on the channel that no manifest names was uploaded by
          # something outside these rails -- the one upload class the pace, cap
          # and gap guards cannot see. Measured 2026-11-11: a second stream
          # inserts clips our code never writes (en-US, category 27, the old
          # brand) at a fixed :21 minute. --alert opens a GitHub issue for the
          # live ones (recent), which is where the alert will be seen.
          echo "### Channel audit" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/audit_channels.py --limit 25 --write --alert --hide-live-rogue 2>&1 | tee work/channel_audit.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_STEP_SUMMARY"
          grep -E "DEFECT:|^==|no defects|videos=|rogue alert|hid |commented" work/channel_audit.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit the report
        if: ${{ github.event.inputs.commit != 'false' }}
        run: |
          git config user.name openhands
          git config user.email openhands@all-hands.dev
          git add docs/MAIL-ALERTS.md content/mail_watch_state.json docs/CHANNEL-AUDIT-LATEST.md
          [ -f content/rogue_hidden.json ] && git add content/rogue_hidden.json || true
          git diff --staged --quiet || git commit -m "chore(watch): refresh the account alert + channel audit reports"
          git pull --rebase --autostash origin main
          bash scripts/git_push_retry.sh
