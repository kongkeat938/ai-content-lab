name: polish-all

# Finishes the "change every title and every ugly thumbnail" pass across all
# three channels, unattended.
#
# Why a job and not a shell loop: the pod is recycled ~20 min after the session
# goes idle, and the work does not fit in one day anyway. The YouTube Data API
# allows 10,000 units a day (a videos.update is 50, a thumbnails.set is on its
# own bucket), so a full pass over 221 videos cannot finish in one sitting. The
# scripts stop cleanly on quotaExceeded and the ledgers (docs/title_changes.json,
# docs/thumbnail_changes.json) skip whatever is already done, so each run advances
# the pass and a later run picks up the rest. Run it after the 08:00 UTC reset.
on:
  workflow_dispatch:
    inputs:
      channels:
        description: "Space-separated: genx dharma kongkeat"
        default: "genx dharma kongkeat"
  push:
    # GitHub's own scheduler has never fired in this repo, so a push is the
    # dependable trigger: editing the scripts below runs the pass. The ledger
    # commits this job makes do not touch these paths, so it cannot loop.
    paths:
      - "scripts/optimize_titles.py"
      - "scripts/make_video_thumbnail.py"
      - ".github/workflows/polish-all.yml"
  schedule:
    # The API quota resets at midnight Pacific (08:00 UTC). GitHub's scheduler is
    # unreliable in this repo, so take several morning ticks; the first one after
    # the reset does the work and the rest no-op on the ledgers. Kept to a few
    # ticks on purpose -- each run lists the channels (~30 quota units), so a
    # 20-minute cron would waste a fifth of the daily budget.
    - cron: "11 8,9,10,11 * * *"

permissions:
  contents: write

concurrency:
  group: polish-all
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Titles, then thumbnails, per channel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          set +e
          # inputs only exist for workflow_dispatch; a push/schedule run must
          # still have the channel list
          CH="${{ github.event.inputs.channels }}"
          CH="${CH:-genx dharma kongkeat}"
          for ch in $CH; do
            echo "### $ch"
            python3 scripts/optimize_titles.py --channel "$ch" --all --apply --sleep 1.0
            python3 scripts/make_video_thumbnail.py --channel "$ch" --all --set
          done

      - name: Commit the ledgers and any new thumbnails
        run: |
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add docs/title_changes.json docs/thumbnail_changes.json
          git add assets/branding/thumbs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new this run"
            exit 0
          fi
          git commit -m "chore(polish): advance titles + thumbnails [skip ci]"
          # a publish workflow may push while this runs; rebase and retry rather
          # than fail -- the next tick finishes anything left
          if git push; then exit 0; fi
          git pull --rebase --autostash origin main && git push || \
            echo "push rejected -- next tick advances the pass"
