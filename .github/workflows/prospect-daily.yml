name: prospect-daily
# Runs once a day at 09:00 Thai time (02:00 UTC). Reads public pages only, needs
# no secret, sends nothing: it refreshes the prospect ledger, expires dead
# listings and writes any new draft for a human to review.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospect-daily
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Discover new requests
        run: python3 scripts/prospect_discover.py
      - name: Expire the dead ones
        run: python3 scripts/prospect_discover.py --check
      - name: Draft offers for the best fits
        run: python3 scripts/proposal_draft.py --top 10
      - name: Report from the ledger
        run: |
          python3 scripts/prospect_discover.py --report
          python3 scripts/proposal_draft.py --report
          python3 scripts/outreach_log.py report
      - name: Commit the ledger
        run: |
          git config user.name  "ak-automation"
          git config user.email "ak-automation@users.noreply.github.com"
          git add content/prospects_external.json content/proposals
          if git diff --cached --quiet; then
            echo "no change today"
          else
            git commit -m "data(prospects): daily refresh [skip ci]"
            bash scripts/git_push_retry.sh --best-effort
          fi
