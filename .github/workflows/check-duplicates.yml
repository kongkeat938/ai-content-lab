name: check-duplicates

# Weekly scan for a video that is already live twice on one channel.
#
# Why this exists: night_120 went live twice on 2026-11-03 because two publish
# runs raced on a stale checkout and the loser's push was rejected, so the
# manifest never learned the second id. The id in the manifest is the only thing
# stopping a re-upload, so a lost id means a silent duplicate. A duplicate costs
# watch-hours to its own twin and looks careless to a viewer; this catches it.
#
# Read-only. It opens one issue and fails the run when a duplicate is found, so
# the finding is visible without watching the log.
on:
  schedule:
    - cron: "23 5 * * 1"   # Monday 05:23 UTC (12:23 Thai)
  workflow_dispatch:
    inputs:
      apply:
        description: "true to unlist the redundant copies now (keeps the copy with the most views; never deletes)"
        default: "false"

permissions:
  contents: write   # commit the privacy ledger when apply=true
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan every channel for a repeated title
        id: scan
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="--apply"; fi
          python3 scripts/check_duplicates.py $ARGS | tee /tmp/dups.txt

      # The weekly run only reports. --apply is dispatch-only on purpose: it says which
      # copy wins (most views) and parks (unlists) the rest, so a person can read the
      # choice before it happens. Measured 2026-11-28: 8 groups were waiting to be cleaned.
      - name: Commit the privacy ledger when something changed
        if: inputs.apply == 'true'
        run: |
          git diff --quiet content/privacy_ledger.json && { echo "no change"; exit 0; }
          git config user.name "ak"
          git config user.email "ak@users.noreply.github.com"
          git add content/privacy_ledger.json
          git commit -m "dup(${{ github.run_id }}): park the redundant copies"
          git push

      - name: Open one issue if a duplicate was found
        if: steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "duplicate video found on a channel" \
            --body "$(printf 'A video title appears twice on one channel.\n\n```\n%s\n```\n\nDispatch this workflow with `apply=true` to keep the copy with the most views and unlist the rest (reversible, recorded in `content/privacy_ledger.json`).\n\nRun: %s/%s/actions/runs/%s\n' "$(cat /tmp/dups.txt)" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
          exit 1
