name: remake shorts

# Publishes a NEW version of every Short that is already live, in the current
# format (blurred picture + instrumental bed). The owner asked for this on
# 2026-11-07: "don't delete anything, publish new versions, the views may
# improve."
#
# It cannot be done as an edit. YouTube's own help is explicit -- "You can't
# replace a video. Any new video you upload to YouTube will get a new URL." The
# Data API edits title/description/tags, never the file. So a new version is a
# new upload, and the old clip is set to unlisted once the new one is live (not
# deleted: its URL, views and comments survive, and one call restores it). A clip
# that is still earning views is left public -- scripts/remake_shorts.py decides.
#
# One per channel per run, and the rail's own daily cap (3) and 2-hour spacing
# still apply, so this cannot flood. The channel token decides which channel.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "dharma | genx | kongkeat"
        default: "dharma"
      per_run:
        description: "how many to remake this run"
        default: "1"
      old:
        description: "keep | unlist | unlist-low | private"
        default: "unlist-low"
      dry_run:
        description: "true to only list what would be remade"
        default: "false"
      force:
        description: "true to ignore the daily cap for this one run"
        default: "false"
  schedule:
    # One remake a day per channel, offset from the publish rail's own runs
    # (01:30/09:30/17:30 UTC) so the two never race for the same channel slot.
    - cron: "20 5,13,21 * * *"

permissions:
  contents: write

jobs:
  remake:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: dharma
            manifest: content/ch2_shorts.json
            token: YT_CH2_REFRESH_TOKEN
          - slug: genx
            manifest: content/ch1_shorts.json
            token: YT_CH1_REFRESH_TOKEN
          - slug: kongkeat
            manifest: content/ch4_shorts.json
            token: YT_CH4_REFRESH_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + Thai fonts + Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-thai-tlwg
          pip install -q google-api-python-client google-auth edge-tts Pillow numpy gTTS
      - name: Remake
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          # On a schedule the matrix gives each job its own channel. On a manual
          # dispatch the operator names one channel, so the jobs for the other two
          # must stand down -- otherwise all three jobs would act on the same
          # channel and publish three remakes to it in one run.
          CH="${{ matrix.slug }}"
          PER="1"; OLD="unlist-low"; DRY="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT="${{ github.event.inputs.channel }}"
            if [ -n "$WANT" ] && [ "$WANT" != "all" ] && [ "$WANT" != "${{ matrix.slug }}" ]; then
              echo "dispatch asked for '$WANT'; this job is ${{ matrix.slug }} -- standing down"
              exit 0
            fi
            PER="${{ github.event.inputs.per_run }}"
            OLD="${{ github.event.inputs.old }}"
            DRY="${{ github.event.inputs.dry_run }}"
            if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS_FORCE="--force"; fi
          fi
          ARGS="--channel $CH --per-run $PER --old $OLD $ARGS_FORCE"
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "remake: $ARGS"
          python3 scripts/remake_shorts.py $ARGS
      - name: Record the new video ids
        if: always()
        run: |
          # Two channel jobs run at once and both push, so a plain `git push` can be
          # rejected and the id -- already live on YouTube -- would be lost, which
          # makes the next run upload the same Short a second time. Measured
          # 2026-11-07: kongkeat's remake uploaded (cuKNEAJn-6A) but its commit was
          # rejected by the racing job, the step then saw no staged change and
          # reported "nothing to record", and the id was never recorded. Rebase onto
          # whatever landed first and retry, so both jobs' records survive.
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add content/*_shorts_remakes.json content/upload_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to record"
            exit 0
          fi
          git commit -m "remake(${{ matrix.slug }}): record the new Short versions"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed"; exit 0; fi
            echo "push rejected (attempt $i); rebasing onto origin/main"
            git pull --rebase --autostash origin main || true
          done
          echo "::error::could not push the record after 5 attempts"
          exit 1
