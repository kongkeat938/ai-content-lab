name: publish-shorts

# Builds vertical Shorts (edge-tts + ffmpeg, both free) and uploads them, one or
# two per run so the channel gets a steady drip instead of one dump. Every Short
# links the 120-minute long video, which is where the watch hours come from.
#
# Safe to run often: scripts/publish_shorts.py never re-uploads an entry that
# already has a video_id, and records the id before anything else can fail.
on:
  workflow_dispatch:
    inputs:
      per_run:
        description: "how many to publish this run (blank = all due)"
        default: "1"
      dry_run:
        description: "true to only list what would be posted"
        default: "false"
  schedule:
    # Three runs, eight hours apart (08:30 / 16:30 / 00:30 Thai), one Short each.
    # Measured 2026-11-07: the zero-view cluster was published in bursts, so the
    # gap between posts is the fix -- not just the count per day.
    - cron: "30 1,9,17 * * *"
  push:
    paths:
      # Inputs only. The manifests (content/ch*_shorts.json) are OUTPUTS this
      # workflow commits back; listing them here made each publish trigger the
      # next one, so a pool grow could cascade into a flood (measured: 89 Shorts
      # on 2026-11-05, median views 1 that day). Never trigger on our own output.
      - "content/ch1_shorts/scripts.json"
      - "content/ch2_shorts/scripts.json"
      - "content/ch4_shorts/scripts.json"
      - "scripts/publish_shorts.py"
      - "scripts/make_short.py"

permissions:
  contents: write   # commit the manifest back with the new video ids

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # matrix is not available to a workflow-level concurrency group, so the lock
    # lives here, one per channel.
    concurrency:
      # Shared with remake-shorts: a publish and a remake for the same
      # channel must never push at once (measured 2026-11-09: they did,
      # and a rebase conflict lost a live remake id).
      group: shorts-upload-${{ matrix.channel }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: dharma
            manifest: content/ch2_shorts.json
          - channel: genx
            manifest: content/ch1_shorts.json
          - channel: kongkeat
            manifest: content/ch4_shorts.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Thai fonts + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-tlwg-garuda fonts-tlwg-kinnari fonts-tlwg-norasi
          pip install --quiet -r requirements.txt

      - name: Guard the rail against a flood
        run: python3 scripts/test_publish_shorts_cap.py

      - name: Publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
          # Optional: K's cloned voice (scripts/tts_fish.py). Unset means the
          # house edge-tts voice is used, so the rail never depends on it.
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_REFERENCE_ID: ${{ secrets.FISH_REFERENCE_ID }}
        run: |
          ARGS="--channel ${{ matrix.channel }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.per_run }}" ]; then ARGS="$ARGS --per-run ${{ github.event.inputs.per_run }}"; fi
          python3 scripts/publish_shorts.py $ARGS

      - name: Record the new video ids
        if: always()
        run: |
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          # Union-merge the append-only JSON ledgers (scripts/git_union_merge.py)
          git config merge.unionjson.driver "python3 scripts/git_union_merge.py %O %A %B"
          git add "${{ matrix.manifest }}"
          # The art/bed ledgers record which image and which bed each Short used,
          # so the next clip cannot repeat them (the owner's no-repeat rule).
          git add content/art_ledger_${{ matrix.channel }}.json content/bed_ledger_${{ matrix.channel }}.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to record"
            exit 0
          fi
          git commit -m "publish(${{ matrix.channel }}): record new Short ids"
          git pull --rebase --autostash origin main
          git push
