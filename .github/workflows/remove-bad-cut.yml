name: remove-bad-cut

# One-off cleanup: delete the 57-minute dharma cut (HkbSguA53ro).
#
# The first Middle Way build looped its 18-piece set twice, so a talk meant to
# run 30 minutes shipped at 57.1 minutes -- the same talk heard twice -- and the
# title still claimed "30 นาที". It has 0 views. The corrected single-pass build
# is queued under the same key, and publish_batch refuses to re-upload while a
# video with the same title is live, so the bad cut has to go first.
#
# It runs after the Data API's 08:00 UTC quota reset, ahead of publish-batch's
# 09:17 tick, so the replacement goes up in the same window. The idempotent
# delete script prints "NOT FOUND" once the video is gone, so later runs are
# harmless; delete this workflow once the replacement is confirmed live.
on:
  workflow_dispatch:
  schedule:
    - cron: "12 8 * * *"   # 08:12 UTC, just after the quota reset
  push:
    paths:
      - "content/ch2_publish.json"   # scheduled crons are unreliable here, so also
                                     # retry on every manifest push (idempotent)

permissions:
  contents: write   # commit the metadata backup

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Delete the pending cuts (idempotent)
        continue-on-error: true   # a second run has nothing to delete
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
        run: |
          # Read the pending list rather than hard-coding one id, so the rail can
          # be reused and the foreman can gate on the same file. A video whose
          # .done marker exists is skipped: the delete already succeeded.
          python3 - <<'PY'
          import json, os, subprocess, sys
          pend = json.load(open("content/deletes.json", encoding="utf-8"))["pending"]
          rc = 0
          for e in pend:
              vid = e["video"]
              if os.path.exists(os.path.join("content", "deleted", vid + ".done")):
                  print(f"{vid}: already deleted (marker present)")
                  continue
              r = subprocess.run([sys.executable, "scripts/delete_video.py",
                                  "--slug", e["slug"], "--video", vid, "--yes"])
              rc = rc or r.returncode
          sys.exit(rc)
          PY

      - name: Commit the metadata backup
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain content/deleted 2>/dev/null)" ]; then
            echo "no backup to commit"
            exit 0
          fi
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add content/deleted
          git commit -m "delete: back up the 57-minute dharma cut before removing it [skip ci]"
          git pull --rebase --autostash origin main
          bash scripts/git_push_retry.sh
