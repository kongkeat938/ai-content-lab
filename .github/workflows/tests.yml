name: tests

# The repo had no test workflow, so "the tests pass" was a chat claim that
# nothing re-checked (measured 2026-11-25: 39 workflows, none ran the suite on
# push). This runs every scripts/test_*.py on each push to main and each PR.
# No secrets are passed: a workflow triggered by any push must not hold them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do NOT cancel an in-flight run on a new push: every commit needs its own
# verdict, otherwise a cancelled run hides whether that tree was ever green
# (measured 2026-11-25: c1a4795's run was cancelled by the next push).
concurrency:
  group: tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + Thai fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-thai-tlwg
      - name: Install Python deps
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -r requirements.txt pyyaml
      - name: Run the suite
        env:
          CI: "1"
        run: python3 scripts/run_tests.py
