name: foreman

# The driver. It reads the ledgers and dispatches only what is due; running it
# twice in a row dispatches nothing the second time.
#
# Earlier notes here claimed GitHub's scheduler never fires for this repo. That
# was wrong, and it mattered: measured 2026-11-07, `event=schedule` has 42 runs,
# the latest the same morning, all successful. The real gap was that THIS
# workflow had no `schedule` of its own -- it only ran on push -- so the driver
# was idle whenever nothing was pushed. The cron below makes it the heartbeat.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/foreman.py"

permissions:
  actions: write   # dispatch other workflows
  contents: write  # the health report
  issues: write    # open/clear the rail-health alert

concurrency:
  group: foreman
  cancel-in-progress: false

jobs:
  foreman:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dispatch what is due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/foreman.py

      - name: Guard the self-timer
        run: python3 scripts/test_watchdog.py

      - name: Health report (never fails the run)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/health.py --write --alert || true

      - name: Commit the health report
        if: always()
        run: |
          if git diff --quiet docs/HEALTH.md 2>/dev/null; then
            echo "no health change"
            exit 0
          fi
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add docs/HEALTH.md
          git commit -m "chore(health): refresh the report"
          # Another workflow (publish-batch, publish-shorts, account-watch, or a
          # second foreman) may push while this job runs. HEALTH.md is a
          # generated artifact, so a rebase conflict on it must not fail the
          # run: abort and let the next foreman tick regenerate it.
          if git push; then exit 0; fi
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "rebase conflict on the generated report -- next run refreshes it"
            exit 0
          fi
          git push || echo "push still rejected -- next run refreshes the report"
