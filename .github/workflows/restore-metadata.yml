name: restore-metadata

# Restore the description + tags that `videos.update` erased.
#
# Measured 2026-11-14: `optimize_titles.apply_title` and `apply_packaging.set_title_tags`
# wrote `part=snippet` bodies without `description`, and `videos.update` REPLACES the whole
# snippet -- so every retitle/packaging pass wiped the description and tags (123/146 genx
# clips had no tags; 120 of them were retitled). The description holds the subscribe ask.
#
# The originals are recoverable from the manifests, so this walks them back. A
# `videos.update` is 50 quota units against a 10,000/day cap, so a full restore cannot
# finish in one run: the script stops cleanly on quotaExceeded and docs/metadata_restore.json
# skips whatever is done, so each morning tick advances the pass. Run it AFTER the 08:00 UTC
# reset.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: write

concurrency:
  group: restore-metadata
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet -r requirements.txt

      - name: Restore description + tags from the manifests
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: python3 scripts/restore_metadata.py --channel all --apply --limit 150

      - name: Commit the ledger
        if: always()
        run: |
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add docs/metadata_restore.json
          if git diff --cached --quiet; then
            echo "nothing restored this run"; exit 0
          fi
          git commit -m "chore(restore): restore erased description + tags [skip ci]"
          git pull --rebase --autostash origin main
          bash scripts/git_push_retry.sh --best-effort
