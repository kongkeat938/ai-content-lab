name: ch2-playlists

# Creates and tops up the ch2 (Farmmer — ธรรมะก่อนนอน) playlists through the
# YouTube Data API -- no browser, no Studio.
#
# Why this job exists: the 2026-11-08 competitor research put a playlist in the
# 30-day plan as the session-time lever -- a playlist gives a viewer a next video
# to play. channel_overhaul.py already knows how to create and fill them
# idempotently (it re-uses an existing playlist by title and adds only the videos
# that are missing), it was just never wired to run on ch2.
#
# Quota: playlists.insert and playlistItems.insert draw the daily pool, which
# resets at midnight Pacific (08:00 UTC); a tick before that defers cleanly.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true to only print what would change"
        default: "false"
  schedule:
    - cron: "40 8 * * *"   # 08:40 UTC, after the 08:00 reset
  push:
    paths:
      - "scripts/channel_overhaul.py"

permissions:
  contents: read

concurrency:
  group: ch2-playlists
  cancel-in-progress: false

jobs:
  playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Organise ch2 playlists
        run: |
          ARGS="--channel ch2 --only playlists"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 scripts/channel_overhaul.py $ARGS
