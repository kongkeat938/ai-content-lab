name: night-compilation

# Builds the ch2 dharma-before-sleep long-form compilation, verifies it against
# the audio/picture gates, and puts the media on a Release. This is the long-form
# rail: auto-shorts already publishes Shorts, but Shorts earn reach, not watch
# hours -- the long file is what the niche actually watches.
#
# It does NOT upload to YouTube. ak does not upload; K reviews the first work of
# each channel. The run leaves a verified file plus a receipt and opens one
# review issue. Once K approves, the same job can upload with the channel
# secrets and a `publish: true` input.
#
# Free tools only: edge-tts for the voice, ffmpeg for the mix, the synthesiser in
# scripts/make_bed.py for the bed. No paid API, no secret needed to build.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Target length in minutes"
        default: "120"
      content:
        description: "Content directory"
        default: "content/night_dharma_01"
  schedule:
    # Weekly, Monday 02:17 UTC. A 2-hour file is not a daily post, and the
    # content set grows between runs.
    - cron: "17 2 * * 1"

permissions:
  contents: write
  issues: write

concurrency:
  group: night-compilation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Thai fonts + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-tlwg-garuda fonts-tlwg-kinnari fonts-tlwg-norasi
          pip install --quiet -r requirements.txt

      - name: Guard the rail
        run: python3 scripts/test_night.py

      - name: Skip if this exact build already exists
        id: fp
        run: |
          # A weekly rebuild of an unchanged 2-hour file is 40 minutes of CI for
          # nothing. Fingerprint the content and the rail; if that release tag
          # already exists, the same bytes have already been built and verified.
          fp="$(cat "${{ inputs.content || 'content/night_dharma_01' }}"/*.txt \
                 scripts/make_compilation.py \
                 scripts/make_bed.py scripts/make_audio.py \
                 scripts/make_night_video.py scripts/make_poster.py \
                 scripts/verify_night.py | sha256sum | cut -c1-12)"
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          if gh release view "night-$fp" >/dev/null 2>&1; then
            echo "build $fp already exists; nothing changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify
        if: steps.fp.outputs.skip != 'true'
        run: |
          python3 scripts/build_night.py \
            --content "${{ inputs.content || 'content/night_dharma_01' }}" \
            --work work/night \
            --out work/night \
            --minutes "${{ inputs.minutes || '120' }}"

      - name: Show the receipt
        if: always() && steps.fp.outputs.skip != 'true'
        run: |
          test -f work/night/receipt.json && cat work/night/receipt.json || echo "no receipt"

      - name: Publish the media to a Release
        if: steps.fp.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="night-${{ steps.fp.outputs.fp }}"
          gh release create "$tag" \
            work/night/video.mp4 work/night/compilation.mp3 \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Verified night compilation. Regenerable from content/ + scripts/." \
            || gh release upload "$tag" work/night/video.mp4 work/night/compilation.mp3 \
               --repo "${{ github.repository }}" --clobber

      - name: Open one review issue with the measured numbers
        if: steps.fp.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/report_night.py --receipt work/night/receipt.json

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "night-compilation run failed" \
            --body "The night-compilation workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
