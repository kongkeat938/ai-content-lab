name: night-compilation

# Builds the ch2 dharma-before-sleep long-form compilation, verifies it against
# the audio/picture gates, and puts the media on a Release. This is the long-form
# rail: auto-shorts already publishes Shorts, but Shorts earn reach, not watch
# hours -- the long file is what the niche actually watches.
#
# It does NOT upload to YouTube. ak decides when to publish (the 2026-11-06 grant
# lifted the ask-K-first gate); the build leaves a verified file plus a receipt
# and opens one review issue. Publishing is a separate publish-batch run.
#
# Free tools only: edge-tts for the voice, ffmpeg for the mix, the synthesiser in
# scripts/make_bed.py for the bed. No paid API, no secret needed to build.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Target length in minutes"
        default: "120"
      content:
        description: "Content directory (blank = pick/generate)"
        default: ""
      key:
        description: "Manifest key (blank = the content dir name)"
        default: ""
      title:
        description: "Video title (blank = a generic dharma-before-sleep title)"
        default: ""
      generate:
        description: "true to generate a fresh content set with Gemini"
        default: "false"
  schedule:
    # Weekly, Monday 02:17 UTC. A 2-hour file is not a daily post, and the
    # content set grows between runs.
    - cron: "17 2 * * 1"

permissions:
  contents: write
  issues: write
  actions: write   # dispatch publish-batch after the manifest is updated

concurrency:
  group: night-compilation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Thai fonts + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-tlwg-garuda fonts-tlwg-kinnari fonts-tlwg-norasi
          pip install --quiet -r requirements.txt

      - name: Guard the rail
        run: python3 scripts/test_night.py

      - name: Resolve the content directory (and generate one on schedule)
        id: pick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          CONTENT="${{ inputs.content }}"
          GEN="${{ inputs.generate }}"
          if [ -z "$CONTENT" ]; then
            if [ "$GEN" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
              # One fresh set a week keeps the rail fed. The directory is dated
              # per ISO week and reused if it already has pieces, so a re-run of
              # the same week reuses the committed set instead of asking Gemini
              # for a different one -- which would fingerprint differently and
              # publish a near-duplicate.
              CONTENT="content/night_auto_$(date -u +%G%V)"
              if ls "$CONTENT"/*.txt >/dev/null 2>&1; then
                echo "$CONTENT already has pieces; reusing it"
              else
                THEMES=("ปล่อยวางความกังวลเรื่องเงิน" "ให้อภัยตัวเองและคนอื่น"
                        "ความเหงาในตอนกลางคืน" "ปล่อยวางความโกรธและความน้อยใจ"
                        "ความรักตัวเองและการยอมรับ" "ขอบคุณสิ่งเล็ก ๆ ในชีวิต"
                        "ปล่อยวางความกลัวอนาคต" "ความสงบในความไม่แน่นอน")
                wk=$(( 10#$(date -u +%V) % ${#THEMES[@]} ))
                python3 scripts/gen_night_scripts.py \
                  --theme "${THEMES[$wk]}" --out "$CONTENT" --count 8
              fi
            else
              CONTENT="content/night_dharma_01"
            fi
          fi
          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"
          echo "building from $CONTENT"

      - name: Skip if this exact build already exists
        id: fp
        run: |
          # A weekly rebuild of an unchanged 2-hour file is 40 minutes of CI for
          # nothing. Fingerprint the content and the rail; if that release tag
          # already exists, the same bytes have already been built and verified.
          fp="$(cat "${{ steps.pick.outputs.content }}"/*.txt \
                 scripts/make_compilation.py \
                 scripts/make_bed.py scripts/make_audio.py \
                 scripts/make_chapter_video.py scripts/make_night_video.py \
                 scripts/make_poster.py scripts/verify_night.py | sha256sum | cut -c1-12)"
          # Fold the voice into the fingerprint: switching between K's cloned
          # voice and edge-tts changes the audio and must force a rebuild.
          fp="${fp}-$(echo "${FISH_REFERENCE_ID:-edge}" | sha256sum | cut -c1-6)"
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          if gh release view "night-$fp" >/dev/null 2>&1; then
            echo "build $fp already exists; nothing changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FISH_REFERENCE_ID: ${{ secrets.FISH_REFERENCE_ID }}

      - name: Commit a freshly generated content set
        if: steps.fp.outputs.skip != 'true'
        run: |
          git add "${{ steps.pick.outputs.content }}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new content to commit"
            exit 0
          fi
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git commit -m "night: add generated content set ${{ steps.pick.outputs.content }} [skip ci]"
          git pull --rebase --autostash origin main
          git push

      - name: Build and verify
        if: steps.fp.outputs.skip != 'true'
        env:
          # Optional: K's cloned voice (scripts/tts_fish.py). Unset = edge-tts.
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_REFERENCE_ID: ${{ secrets.FISH_REFERENCE_ID }}
        run: |
          python3 scripts/build_night.py \
            --content "${{ steps.pick.outputs.content }}" \
            --work work/night \
            --out work/night \
            --minutes "${{ inputs.minutes || '120' }}" \
            --image-style dharma \
            --hook-file content/hooks/dharma.md \
            --chapters \
            --image-prompt "serene Thai Buddhist night, soft moonlight, mist, calm"

      - name: Show the receipt
        if: always() && steps.fp.outputs.skip != 'true'
        run: |
          test -f work/night/receipt.json && cat work/night/receipt.json || echo "no receipt"

      - name: Publish the media to a Release
        if: steps.fp.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="night-${{ steps.fp.outputs.fp }}"
          gh release create "$tag" \
            work/night/video.mp4 work/night/compilation.mp3 \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Verified night compilation. Regenerable from content/ + scripts/." \
            || gh release upload "$tag" work/night/video.mp4 work/night/compilation.mp3 \
               --repo "${{ github.repository }}" --clobber

      - name: Open one review issue with the measured numbers
        if: steps.fp.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/report_night.py --receipt work/night/receipt.json

      - name: Add the release to the publish manifest and start the upload
        # This is the hand-off the rail was missing: without it the file sat on a
        # Release and a person had to write the manifest entry by hand. Writing it
        # here is what turns the weekly build into a weekly published video.
        if: steps.fp.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT="${{ steps.pick.outputs.content }}"
          KEY="${{ inputs.key }}"; KEY="${KEY:-$(basename "$CONTENT")}"
          TITLE="${{ inputs.title }}"
          TITLE="${TITLE:-ธรรมะก่อนนอน 120 นาที หลับลึกถึงเช้า ปล่อยวางความเครียดทั้งวัน จิตสงบ}"
          MIN="${{ inputs.minutes || '120' }}"
          python3 scripts/add_release_to_manifest.py \
            --tag "night-${{ steps.fp.outputs.fp }}" \
            --key "$KEY" --content "$CONTENT" --minutes "$MIN" \
            --title "$TITLE" --receipt work/night/receipt.json
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add content/ch2_publish.json
          git add assets/branding/farmmer/thumbs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git commit -m "night: queue $KEY for publish [skip ci]"
          git pull --rebase --autostash origin main
          git push
          # A push made with GITHUB_TOKEN does not start another workflow, so the
          # upload is dispatched explicitly rather than left to the push trigger.
          gh workflow run publish-batch.yml --repo "${{ github.repository }}"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "night-compilation run failed" \
            --body "The night-compilation workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
