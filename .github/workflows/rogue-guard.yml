name: rogue-guard

# Keep a rogue upload OFF the public channel within the hour, without a person.
#
# A second stream (external, a leaked token) inserts clips our code never writes
# at a fixed :21 minute. `audit_channels --hide-live-rogue` pauses each one
# (privacyStatus=private, reversible) and opens an issue that clears itself; but
# account-watch only runs that once a day, so a clip uploaded at :21 can sit
# PUBLIC for up to ~18 h. This rail runs the same audit often and cheaply (limit
# 10, ~12 quota units a run) so the exposure window is minutes, not a day. It
# never deletes -- the private set is cleared by private-delete after the quota
# reset. A spent quota makes a run a clean no-op; the next one hides.
#
# K (2026-11-12): "do not make the system walk into a dead end at K -- make it
# auto." The Data API cannot set channel-level privacy (channels.update writes
# only brandingSettings/invideoPromotion, measured from the discovery doc), so the
# auto loop is the answer, not a human.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the rogue ledger + the audit report
  issues: write     # the rogue alert issue opens/clears itself

concurrency:
  group: rogue-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the YouTube client
        run: pip install --quiet google-api-python-client google-auth-oauthlib

      - name: Pause any live rogue clip (reversible) and refresh the alert
        continue-on-error: true   # a spent quota defers cleanly to the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          set +e
          python3 scripts/audit_channels.py --limit 10 --hide-live-rogue --alert \
            --write 2>&1 | tee work/rogue_guard.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_STEP_SUMMARY"
          grep -E "hid |rogue alert|no defects|DEFECT:" work/rogue_guard.txt \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit the ledger + report
        if: always()
        run: |
          git config user.name openhands
          git config user.email openhands@all-hands.dev
          changed=0
          for f in content/rogue_hidden.json docs/CHANNEL-AUDIT-LATEST.md; do
            if [ -f "$f" ] && [ -n "$(git status --porcelain "$f" 2>/dev/null)" ]; then
              git add "$f"; changed=1
            fi
          done
          if [ "$changed" = "0" ]; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(rogue-guard): pause the live rogue clips [skip ci]"
          git pull --rebase --autostash origin main
          bash scripts/git_push_retry.sh
