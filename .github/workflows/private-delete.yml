name: private-delete

# Remove the PARKED private videos on our channels (K, 2026-11-12: "delete the
# private clips and the source that made them").
#
# A delete costs quota and the project's daily Data API quota is spent by midday
# (the pod read 403s at 14:00 UTC), so this runs just after the 08:00 UTC reset,
# ahead of the publish rails. It re-lists the channels live, so it needs no
# hard-coded id list and stays correct as the rogue stream keeps uploading; it
# deletes only `private` clips with no future publishAt (a scheduled release is
# never touched -- see scripts/test_private_videos.py) and backs each one up
# first. A clip already gone is simply absent from the next listing, so re-runs
# are harmless.
on:
  workflow_dispatch:
  schedule:
    - cron: "14 8 * * *"   # 08:14 UTC, just after the quota reset
  push:
    paths:
      - "content/rogue_hidden.json"   # a newly-hidden clip means a delete is due

permissions:
  contents: write   # commit the metadata backups + the report

jobs:
  private-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Delete the parked private videos (idempotent)
        continue-on-error: true   # a spent quota defers to the next reset cleanly
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
        run: |
          python3 scripts/private_videos.py \
            --slug dharma --slug genx --slug kongkeat-story --delete --yes

      - name: Commit the backups and the report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          changed=0
          for d in content/deleted work; do
            if [ -n "$(git status --porcelain "$d" 2>/dev/null)" ]; then
              git add "$d"; changed=1
            fi
          done
          if [ "$changed" = "0" ]; then echo "nothing to commit"; exit 0; fi
          git commit -m "private-delete: back up metadata before removing private videos [skip ci]"
          git pull --rebase --autostash origin main
          bash scripts/git_push_retry.sh
