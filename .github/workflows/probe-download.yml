name: probe download

# Throwaway probe: does yt-dlp's YouTube bot check depend on the runner's IP
# range? ubuntu-latest is refused on every client (measured 2026-11-07), so try
# the other two hosted images before deciding the harvest needs cookies.

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp
      - name: probe
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, sys
          vid = "A3jr9T148Q8"
          for client in ("web", "ios", "tv"):
              r = subprocess.run([sys.executable, "-m", "yt_dlp",
                                  "--extractor-args", f"youtube:player_client={client}",
                                  "-f", "bestaudio", "-g",
                                  f"https://www.youtube.com/watch?v={vid}"],
                                 capture_output=True, text=True)
              err = (r.stderr.strip().splitlines() or [""])[-1]
              print(f"  {client:8} rc={r.returncode} {'OK' if r.returncode == 0 else err[-80:]}")
          PY
