name: harvest music

# The owner asked for the channel's real music as the bed under the Shorts
# instead of a synthesised pad. The music is ours (AERIS Music, ch3), so reuse is
# safe. The download cannot run on the dev pod -- YouTube refuses its IP with a
# 403 bot check (measured 2026-11-07) -- so it runs here, on a runner with a
# clean address, and commits the beds back for the publish rail to pick up.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "how many tracks to harvest"
        default: "12"
  schedule:
    - cron: "40 4 * * 0"     # Sundays 04:40 UTC, refresh the bed library

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp
      - name: harvest beds from our own channel
        run: |
          python3 scripts/harvest_music.py \
            --rss UCm44BjAn03ruOF-WaA3ZRww \
            --out-dir assets/music \
            --seconds 45 --limit "${{ github.event.inputs.limit || '12' }}"
      - name: commit the beds back
        run: |
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add assets/music
          if git diff --cached --quiet; then
            echo "no new beds"
          else
            git commit -m "music: stock the bed library from our own channel"
            git push
          fi
