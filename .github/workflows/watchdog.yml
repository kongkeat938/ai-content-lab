name: watchdog

# A self-chaining timer. (The old note here said the scheduler never fires; that
# was wrong -- measured 2026-11-07, `event=schedule` has 42 green runs.) This job
# still starts itself again before it ends, so a gap between cron ticks cannot
# stall the chain. Each tick it dispatches the foreman, which dispatches only the
# rails that are actually due.
#
# The repo is public, so Actions minutes are free. One `concurrency` group keeps
# two chains from coexisting. To stop the chain: create content/STOP.
#
# It queues its successor before it does any work, so a link that dies mid-run
# cannot break the chain. It no longer needs a hand to start it either: the
# foreman dispatches it whenever the chain goes quiet, and a backup schedule here
# catches the case where both the chain and the foreman's own tick are missed.
on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "foreman ticks per chain link"
        default: "2"
      interval:
        description: "seconds between ticks"
        default: "7200"
      chain:
        description: "true to re-dispatch the chain (false = single test run)"
        default: "true"
  # A second way in. The chain below is the primary timer, but GitHub's cron is
  # unreliable here (measured 2026-11-07: the */30 foreman cron fired once in 30
  # runs), so a scheduled tick is only a backup -- the chain, plus the foreman's
  # own self-heal, are what actually keep the timer alive.
  schedule:
    - cron: "45 */4 * * *"

permissions:
  actions: write

concurrency:
  group: watchdog        # never two chains at once
  cancel-in-progress: false

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # under the 360-minute ceiling; each link is short
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drive the foreman, then re-chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.chain }}" = "false" ]; then EXTRA="--no-chain"; fi
          python3 scripts/watchdog.py \
            --cycles "${{ github.event.inputs.cycles || '2' }}" \
            --interval "${{ github.event.inputs.interval || '7200' }}" $EXTRA
